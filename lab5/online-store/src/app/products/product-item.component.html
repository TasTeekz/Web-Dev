<article class="card">
  <div class="media">
    <button class="nav left" type="button" (click)="prevImage()" aria-label="Previous image">
      ‹
    </button>

    <img
      class="main-img"
      [src]="selectedImage"
      [alt]="product.name"
      (click)="openKaspi()"
      title="Открыть на Kaspi.kz"
    />

    <button class="nav right" type="button" (click)="nextImage()" aria-label="Next image">›</button>

    <div class="thumbs">
      @for (img of product.images; track img) {
        <img
          class="thumb"
          [src]="img"
          [alt]="product.name"
          (click)="selectImage(img)"
          [class.active]="img === selectedImage"
        />
      }
    </div>
  </div>

  <div class="content">
    <h3 class="title" (click)="openKaspi()">{{ product.name }}</h3>
    <p
      class="desc"
      [class.expanded]="isDescExpanded"
      (click)="toggleDescription($event)"
      title="Нажмите, чтобы раскрыть/свернуть"
    >
      {{ product.description }}
    </p>

    <div class="row">
      <div class="price">{{ formatKzt(product.price) }}</div>

      <div class="rating" aria-label="Product rating">
        @for (s of getStars(product.rating); track $index) {
          <span class="star" [class.full]="s === 'full'" [class.half]="s === 'half'">★</span>
        }
        <span class="badge">{{ product.rating.toFixed(1) }}</span>
      </div>
    </div>

    <div class="likes">
      <span>❤️ {{ product.likes }}</span>
      <button type="button" class="btn" (click)="like()">Like</button>
    </div>

    <div class="actions">
      <a class="link" [href]="product.link" target="_blank" rel="noopener noreferrer">
        Open on Kaspi
      </a>

      <button type="button" class="btn" (click)="shareWhatsApp()">Share WhatsApp</button>
      <button type="button" class="btn" (click)="shareTelegram()">Share Telegram</button>
      <button type="button" class="btn delete" (click)="deleteProduct()">Delete</button>
    </div>
  </div>
</article>
