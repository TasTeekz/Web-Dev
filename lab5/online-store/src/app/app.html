<div class="layout">
  <aside class="sidebar">
    <div class="brand">Online Store</div>

    <button class="cat" (click)="showAll()" [class.active]="selectedCategoryId === null">
      All products
    </button>

    <div class="divider"></div>

    @for (cat of categories; track cat.id) {
      <button
        class="cat"
        (click)="selectCategory(cat.id)"
        [class.active]="selectedCategoryId === cat.id"
      >
        {{ cat.name }}
      </button>
    }
  </aside>

  <main class="content">
    <app-product-list [products]="productsToShow"></app-product-list>
  </main>
</div>
